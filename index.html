<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UT - Talent Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    body { background-color: #f4f6f9; }
    .navbar { background: #601a1a !important; }
    .card { border: none; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .navbar-brand { line-height: 1.2; }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark mb-4 shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-white text-decoration-none d-flex align-items-center" href="#">
        <img src="logo.png" alt="UT Logo" style="height: 45px; margin-right: 15px; border-radius: 6px;">
        <div>
          Universal Tractor Co., Ltd.<br>
          <small style="font-size: 0.8rem; font-weight: 400;">Talent Management System</small>
        </div>
      </a>
      <div>
        <a href="index.html" class="btn btn-light btn-sm mx-1">Directory</a>
        <a href="transaction.html" class="btn btn-outline-light btn-sm mx-1">HR Records</a>
        <a href="dashboard.html" class="btn btn-outline-light btn-sm mx-1">Analytics</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="card p-4">
      <h4 class="mb-4 text-primary fw-bold">Employee Directory Setup</h4>
      <ul class="nav nav-tabs mb-4">
        <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#createEmp">Register Employee</a></li>
        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#editEmp">Edit Profile</a></li>
        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#dept">Departments</a></li>
        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#settings">Job Structure & Settings</a></li>
      </ul>

      <div class="tab-content">
        <!-- ဝန်ထမ်းအသစ်သွင်းခြင်း -->
        <div class="tab-pane fade show active" id="createEmp">
          <form id="formCreate" onsubmit="handleEmpSubmit(event, 'create')">
            <div class="row g-3">
              <div class="col-md-3"><label class="fw-bold">Employee ID</label><input type="text" class="form-control" name="code" required></div>
              <div class="col-md-3"><label class="fw-bold">Full Name</label><input type="text" class="form-control" name="name" required></div>
              <div class="col-md-3"><label class="fw-bold text-danger">Login Username</label><input type="text" class="form-control border-danger" name="username" required placeholder="e.g. emp001"></div>
              <div class="col-md-3"><label class="fw-bold text-danger">Login Password</label><input type="text" class="form-control border-danger" name="password" required placeholder="Password"></div>
              
              <div class="col-md-3"><label class="fw-bold">Department</label><select class="form-select dept-dropdown" name="dept" onchange="updateSubAndPos(this, 'create')" required><option value="">Loading...</option></select></div>
              <div class="col-md-3"><label class="fw-bold">Sub-Department</label><select class="form-select sub-dept-dropdown" name="subDept"><option value="">Select Dept First</option></select></div>
              <div class="col-md-3"><label class="fw-bold">Position</label><select class="form-select create-position" name="position"><option value="">Select Dept First</option></select></div>
              <div class="col-md-3"><label class="fw-bold">Profile Photo</label><input type="file" class="form-control" id="photoFile" accept="image/*"></div>
              
              <div class="col-md-3"><label class="fw-bold">Phone</label><input type="text" class="form-control" name="phone"></div>
              <div class="col-md-3"><label class="fw-bold">Email</label><input type="email" class="form-control" name="email"></div>
              <div class="col-md-3"><label class="fw-bold">Bio / Skills</label><textarea class="form-control" name="bio" rows="2"></textarea></div>
              <div class="col-md-3"><label class="fw-bold">Internal Remarks</label><textarea class="form-control" name="remark" rows="2"></textarea></div>
            </div>
            <button type="submit" class="btn btn-primary mt-3 px-4" id="btnCreate">Register Profile</button>
          </form>
        </div>

        <!-- ဝန်ထမ်းအချက်အလက်ပြင်ဆင်ခြင်း -->
        <div class="tab-pane fade" id="editEmp">
          <form id="formEdit" onsubmit="handleEmpSubmit(event, 'edit')">
            <div class="row g-3 mb-3 bg-light p-2 rounded">
              <div class="col-md-4">
                <label class="fw-bold">Select Employee</label>
                <select class="form-select border-primary" id="editEmpSelect" name="code" onchange="fetchEmpData()" required><option value="">Loading...</option></select>
              </div>
              <div class="col-md-3 align-self-end" id="statusContainer" style="display:none;">
                <label class="fw-bold text-dark mb-2">Employment Status</label>
                <div class="form-check form-switch fs-5">
                  <input class="form-check-input border-secondary" type="checkbox" id="statusToggle" name="status" checked>
                  <label class="form-check-label fw-bold text-success" for="statusToggle" id="statusLabel">Active</label>
                </div>
              </div>
            </div>

            <div class="row g-3" id="editFields" style="display:none;">
              <div class="col-md-3"><label class="fw-bold">Full Name</label><input type="text" class="form-control" name="name" required></div>
              <div class="col-md-3"><label class="fw-bold text-danger">Login Username</label><input type="text" class="form-control border-danger" name="username" required></div>
              <div class="col-md-3"><label class="fw-bold text-danger">Login Password</label><input type="text" class="form-control border-danger" name="password" required></div>
              <div class="col-md-3"><label class="fw-bold">Phone</label><input type="text" class="form-control" name="phone"></div>

              <div class="col-md-3"><label class="fw-bold">Department</label><select class="form-select dept-dropdown" name="dept" onchange="updateSubAndPos(this, 'edit')" required></select></div>
              <div class="col-md-3"><label class="fw-bold">Sub-Department</label><select class="form-select sub-dept-dropdown" name="subDept"></select></div>
              <div class="col-md-3"><label class="fw-bold">Position</label><select class="form-select edit-position" name="position"></select></div>
              <div class="col-md-3"><label class="fw-bold">Email</label><input type="email" class="form-control" name="email"></div>

              <div class="col-md-4"><label class="fw-bold">Bio / Skills</label><textarea class="form-control" name="bio" rows="3"></textarea></div>
              <div class="col-md-4"><label class="fw-bold">Internal Remarks</label><textarea class="form-control" name="remark" rows="3"></textarea></div>
              <div class="col-md-2 text-center">
                <label class="fw-bold">Current Photo</label><br>
                <img id="editEmpThumbnail" src="" style="max-height: 75px; display: none; border-radius: 5px; margin: 0 auto;">
                <span id="noImageText" class="text-muted small" style="display:none;">No Photo</span>
              </div>
              <div class="col-md-2"><label class="fw-bold">Update Photo</label><input type="file" class="form-control" id="editPhotoFile" accept="image/*"></div>

              <input type="hidden" name="photoUrl" id="existingPhotoUrl">
              <div class="col-md-12"><button type="submit" class="btn btn-success px-4" id="btnEdit">Update Profile</button></div>
            </div>
          </form>
        </div>

        <!-- ဌာနများ သတ်မှတ်ခြင်း -->
        <div class="tab-pane fade" id="dept">
          <form id="formDept" onsubmit="submitDeptForm(event)">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="fw-bold">Main Department</label>
                <input list="mainDeptList" class="form-control border-primary" name="main" placeholder="e.g., Operations" required>
                <datalist id="mainDeptList"></datalist>
              </div>
              <div class="col-md-4">
                <label class="fw-bold">Sub-Department</label>
                <input type="text" class="form-control border-primary" name="sub" placeholder="e.g., Logistics" required>
              </div>
              <div class="col-md-4 align-self-end"><button type="submit" class="btn btn-primary w-100">Add Division</button></div>
            </div>
          </form>
        </div>

        <!-- ရာထူးနှင့် ရုံးချိန်/တည်နေရာ သတ်မှတ်ခြင်း -->
        <div class="tab-pane fade" id="settings">
          <form onsubmit="addSettingPair(event)" class="mb-4 pb-4 border-bottom">
            <h6 class="fw-bold text-secondary mb-3">Add Job Position by Department</h6>
            <div class="row g-3">
              <div class="col-md-4"><label class="fw-bold">Department</label><select id="pairDept" class="form-select border-primary" required></select></div>
              <div class="col-md-4"><label class="fw-bold">Job Position</label><input type="text" id="pairPos" class="form-control border-primary" placeholder="e.g. Senior Analyst" required></div>
              <div class="col-md-4 align-self-end"><button type="submit" class="btn btn-secondary w-100">Add Structure</button></div>
            </div>
          </form>

          <form onsubmit="addSystemSetting(event)">
            <h6 class="fw-bold text-secondary mb-3">Add System / Leave Setting</h6>
            <div class="row g-3">
              <div class="col-md-4">
                <label class="fw-bold">Setting Category</label>
                <select id="sysCat" class="form-select border-info" required>
                  <option value="Leave Type">Leave Type (e.g. Casual Leave, Medical Leave)</option>
                  <option value="Office Lat">Office Lat (e.g. 16.8409)</option>
                  <option value="Office Lng">Office Lng (e.g. 96.1735)</option>
                  <option value="Geo Radius">Geo Radius in Meters (e.g. 200)</option>
                  <option value="Work Start">Work Start Time (e.g. 09:00)</option>
                  <option value="Work End">Work End Time (e.g. 17:00)</option>
                </select>
              </div>
              <div class="col-md-4"><label class="fw-bold">Value</label><input type="text" id="sysVal" class="form-control border-info" required></div>
              <div class="col-md-4 align-self-end"><button type="submit" class="btn btn-info text-white w-100">Save Setting</button></div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // ၁။ သင်၏ Firebase Config အချက်အလက်များကို ဤနေရာတွင် အစားထိုးပါ
    const firebaseConfig = {
  apiKey: "AIzaSyCnQcsv8TekFkOyOPnb3UWZytPq7zBxLfI",
  authDomain: "my-apps-a87a3.firebaseapp.com",
  projectId: "my-apps-a87a3",
  storageBucket: "my-apps-a87a3.firebasestorage.app",
  messagingSenderId: "880270085984",
  appId: "1:880270085984:web:d65a0c381172def3af1805"
};
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let appData = { emps: [], depts: [], settings: { departments: {}, system: {}, leaveTypes: [] } };

    document.getElementById('statusToggle').addEventListener('change', function() {
      let lbl = document.getElementById('statusLabel');
      lbl.innerText = this.checked ? 'Active' : 'Resigned / Inactive';
      lbl.className = this.checked ? 'form-check-label fw-bold text-success' : 'form-check-label fw-bold text-danger';
    });

    window.onload = loadAllData;

    // ပုံများကို Database ထဲ တိုက်ရိုက်သိမ်းနိုင်ရန် ချုံ့ပေးသည့် Function
    function compressImage(file, maxWidth = 400) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const scale = maxWidth / img.width;
            canvas.width = img.width > maxWidth ? maxWidth : img.width;
            canvas.height = img.width > maxWidth ? img.height * scale : img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.7));
          };
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function loadAllData() {
      try {
        const [eSnap, dSnap, sSnap] = await Promise.all([
          db.collection('employees').get(),
          db.collection('departments').get(),
          db.collection('tms_settings').get()
        ]);

        appData.emps = eSnap.docs.map(doc => ({ docId: doc.id, ...doc.data() }));
        appData.depts = dSnap.docs.map(doc => [doc.data().main, doc.data().sub]);

        let settingsObj = { departments: {}, system: {}, leaveTypes: [] };
        const systemKeys = ['Office Lat', 'Office Lng', 'Geo Radius', 'Work Start', 'Work End'];

        sSnap.docs.forEach(doc => {
          let row = doc.data();
          if (systemKeys.includes(row.category)) settingsObj.system[row.category] = row.subcategory;
          else if (row.category === 'Leave Type') settingsObj.leaveTypes.push(row.subcategory);
          else {
            if (!settingsObj.departments[row.category]) settingsObj.departments[row.category] = [];
            settingsObj.departments[row.category].push(row.subcategory);
          }
        });

        appData.settings = settingsObj;
        renderDepts();
        renderEmps();
      } catch (err) {
        Swal.fire('Connection Error', err.message, 'error');
      }
    }

    function renderDepts() {
      let mainDepts = [...new Set(appData.depts.map(d => d[0]).filter(Boolean))];
      let deptOpts = '<option value="">Select Department...</option>' + mainDepts.map(d => `<option value="${d}">${d}</option>`).join('');
      document.querySelectorAll('.dept-dropdown').forEach(el => el.innerHTML = deptOpts);
      document.getElementById('pairDept').innerHTML = deptOpts;
      document.getElementById('mainDeptList').innerHTML = mainDepts.map(d => `<option value="${d}"></option>`).join('');
    }

    function renderEmps() {
      let opts = appData.emps.map(e => `<option value="${e.code}">${e.code} - ${e.name} ${e.status === 'Inactive' ? '(Resigned)' : ''}</option>`).join('');
      document.getElementById('editEmpSelect').innerHTML = opts ? '<option value="">Select Employee...</option>' + opts : '<option value="">No Data Found</option>';
    }

    function updateSubAndPos(deptEl, actionType) {
      let form = deptEl.closest('form');
      let mainDept = deptEl.value;
      let subSelect = form.querySelector('.sub-dept-dropdown');
      if (subSelect) {
        let subs = appData.depts.filter(d => d[0] === mainDept).map(d => d[1]).filter(Boolean);
        subSelect.innerHTML = '<option value="">Select Sub-Department...</option>' + subs.map(s => `<option value="${s}">${s}</option>`).join('');
      }
      let posSelect = form.querySelector(actionType === 'create' ? '.create-position' : '.edit-position');
      if (posSelect) {
        let positions = appData.settings.departments[mainDept] || [];
        posSelect.innerHTML = '<option value="">Select Position...</option>' + positions.map(p => `<option value="${p}">${p}</option>`).join('');
      }
    }

    async function submitDeptForm(e) {
      e.preventDefault();
      let form = e.target;
      let data = Object.fromEntries(new FormData(form).entries());
      try {
        await db.collection('departments').add({ main: data.main, sub: data.sub });
        Swal.fire('Success', 'Department saved.', 'success');
        form.reset();
        loadAllData();
      } catch (err) { Swal.fire('Error', err.message, 'error'); }
    }

    async function addSettingPair(e) {
      e.preventDefault();
      let dept = document.getElementById('pairDept').value;
      let pos = document.getElementById('pairPos').value;
      try {
        await db.collection('tms_settings').add({ category: dept, subcategory: pos });
        Swal.fire('Added', 'Job Structure saved.', 'success');
        document.getElementById('pairPos').value = '';
        loadAllData();
      } catch (err) { Swal.fire('Error', err.message, 'error'); }
    }

    async function addSystemSetting(e) {
      e.preventDefault();
      let cat = document.getElementById('sysCat').value;
      let val = document.getElementById('sysVal').value;
      try {
        if (cat !== 'Leave Type') {
          let existing = await db.collection('tms_settings').where('category', '==', cat).get();
          existing.forEach(doc => doc.ref.delete());
        }
        await db.collection('tms_settings').add({ category: cat, subcategory: val });
        Swal.fire('Saved', 'System setting updated.', 'success');
        document.getElementById('sysVal').value = '';
        loadAllData();
      } catch (err) { Swal.fire('Error', err.message, 'error'); }
    }

    async function handleEmpSubmit(e, action) {
      e.preventDefault();
      let btn = document.getElementById(action === 'create' ? 'btnCreate' : 'btnEdit');
      btn.disabled = true; btn.innerText = "Saving...";
      let form = e.target;
      let data = Object.fromEntries(new FormData(form).entries());
      let fileInput = document.getElementById(action === 'create' ? 'photoFile' : 'editPhotoFile');

      data.status = action === 'edit' ? (document.getElementById('statusToggle').checked ? 'Active' : 'Inactive') : 'Active';
      data.dept = data.subDept ? `${data.dept} > ${data.subDept}` : data.dept;
      delete data.subDept;

      try {
        if (fileInput.files.length > 0) {
          data.photoUrl = await compressImage(fileInput.files[0], 400);
        } else {
          data.photoUrl = action === 'edit' ? document.getElementById('existingPhotoUrl').value : "";
        }

        if (action === 'create') {
          data.created_at = Date.now();
          await db.collection('employees').doc(data.code).set(data);
          Swal.fire('Success', 'New Employee registered.', 'success');
          form.reset();
        } else {
          await db.collection('employees').doc(data.code).update(data);
          Swal.fire('Success', 'Employee profile updated.', 'success');
        }
        loadAllData();
      } catch (err) {
        Swal.fire('Error', err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerText = action === 'create' ? "Register Profile" : "Update Profile";
      }
    }

    function fetchEmpData() {
      const code = document.getElementById('editEmpSelect').value;
      const emp = appData.emps.find(i => i.code === code);
      if (emp) {
        document.getElementById('editFields').style.display = 'flex';
        document.getElementById('statusContainer').style.display = 'block';
        let frm = document.getElementById('formEdit');
        let dParts = emp.dept ? emp.dept.split(' > ') : [""];

        frm.name.value = emp.name || '';
        frm.username.value = emp.username || '';
        frm.password.value = emp.password || '';
        frm.bio.value = emp.bio || '';
        frm.dept.value = dParts[0].trim();
        updateSubAndPos(frm.dept, 'edit');
        if (dParts.length > 1 && frm.subDept) frm.subDept.value = dParts[1].trim();
        frm.position.value = emp.position || '';
        frm.phone.value = emp.phone || '';
        frm.email.value = emp.email || '';
        frm.remark.value = emp.remark || '';

        let toggle = document.getElementById('statusToggle');
        toggle.checked = (emp.status !== 'Inactive');
        toggle.dispatchEvent(new Event('change'));

        let thumbImg = document.getElementById('editEmpThumbnail');
        let noImgText = document.getElementById('noImageText');
        document.getElementById('existingPhotoUrl').value = emp.photoUrl || '';
        if (emp.photoUrl) {
          thumbImg.src = emp.photoUrl; thumbImg.style.display = 'block'; noImgText.style.display = 'none';
        } else {
          thumbImg.style.display = 'none'; noImgText.style.display = 'block';
        }
      } else {
        document.getElementById('editFields').style.display = 'none';
        document.getElementById('statusContainer').style.display = 'none';
      }
    }
  </script>
</body>
</html>
