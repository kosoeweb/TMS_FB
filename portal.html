<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>UT - Employee Portal</title>
  <!-- Mobile App (PWA) Meta Tags -->
  <meta name="theme-color" content="#601a1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="UT Portal">
  <link rel="apple-touch-icon" href="emp.png">
  <link id="pwaManifest" rel="manifest">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    body { background-color: #f4f6f9; }
    .navbar { background: #601a1a !important; }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark mb-4 shadow-sm">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <span class="navbar-brand fw-bold text-white d-flex align-items-center mb-0">
        <img src="logo.png" style="height: 35px; margin-right: 10px; border-radius: 4px;">
        <div style="line-height: 1.1;">Universal Tractor Co., Ltd.<br><small style="font-size: 0.75rem;">Employee Portal</small></div>
      </span>
      <div class="d-flex gap-2">
        <button id="btnInstallApp" class="btn btn-warning btn-sm fw-bold" style="display:none;" onclick="installPWA()"><i class="bi bi-download"></i> Install App</button>
        <button id="btnLogout" class="btn btn-outline-light btn-sm" style="display:none;" onclick="logoutEmp()"><i class="bi bi-power"></i> Logout</button>
      </div>
    </div>
  </nav>

  <div class="container" style="max-width: 650px;">

    <!-- ၁။ ဝန်ထမ်း Login ဝင်ရန် အပိုင်း -->
    <div class="card p-4 shadow-sm border-0 mt-4" id="loginSection">
      <h5 class="fw-bold text-center text-primary mb-1">Employee Login</h5>
      <p class="text-muted text-center small mb-4">Sign in with your Username and Password</p>
      <form onsubmit="handleLogin(event)">
        <div class="mb-3">
          <label class="fw-bold small mb-1">Username</label>
          <input type="text" id="loginUser" class="form-control border-primary" placeholder="Enter username" required>
        </div>
        <div class="mb-3">
          <label class="fw-bold small mb-1">Password</label>
          <input type="password" id="loginPass" class="form-control border-primary" placeholder="Enter password" required>
        </div>
        <button type="submit" id="btnLogin" class="btn btn-primary w-100 fw-bold py-2">Login to Portal</button>
      </form>
    </div>

    <!-- ၂။ ဝန်ထမ်း Profile ပြသသည့် အပိုင်း -->
    <div id="profileBox" class="card p-3 mb-3 align-items-center bg-white rounded border-0 shadow-sm" style="display:none; flex-direction:row;">
      <img id="profImg" src="" style="width:70px; height:70px; object-fit:cover; border-radius:50%; border: 3px solid #f4f6f9;">
      <div class="ms-3 flex-grow-1">
        <h5 id="profName" class="mb-1 fw-bold text-primary"></h5>
        <div id="profPos" class="text-dark fw-bold small mb-1"></div>
        <div id="profDept" class="text-muted small"></div>
        <span id="profCodeBadge" class="badge bg-secondary mt-1"></span>
      </div>
    </div>

    <!-- ၃။ Attendance, Leave နှင့် Ledger အပိုင်း -->
    <div id="formsSection" style="display:none;">
      <ul class="nav nav-pills mb-3 nav-justified bg-white rounded shadow-sm p-1">
        <li class="nav-item"><a class="nav-link active fw-bold" data-bs-toggle="tab" href="#attTab"><i class="bi bi-geo-alt-fill"></i> Attendance</a></li>
        <li class="nav-item"><a class="nav-link fw-bold text-secondary" data-bs-toggle="tab" href="#leaveTab"><i class="bi bi-calendar-event"></i> Leave</a></li>
        <li class="nav-item"><a class="nav-link fw-bold text-info" data-bs-toggle="tab" href="#ledgerTab"><i class="bi bi-journal-text"></i> My Ledger</a></li>
      </ul>

      <div class="tab-content">
        <div class="tab-pane fade show active" id="attTab">
          <div class="card p-3 shadow-sm border-0 border-top border-primary border-4">
            <h6 class="fw-bold mb-3 text-secondary">Daily Time Record</h6>
            <div class="alert alert-light border small mb-3">
              <div class="d-flex justify-content-between mb-1"><strong>Time Status:</strong> <span id="timeStat" class="text-primary">Calculating...</span></div>
              <div class="d-flex justify-content-between"><strong>Location:</strong> <span id="geoStat" class="text-muted">Fetching GPS...</span></div>
            </div>
            <div class="d-flex justify-content-between gap-2">
              <button class="btn btn-success w-50 fw-bold py-2" id="btnIn" onclick="submitAtt('Check-In')" disabled><i class="bi bi-box-arrow-in-right"></i> Check In</button>
              <button class="btn btn-danger w-50 fw-bold py-2" id="btnOut" onclick="submitAtt('Check-Out')" disabled><i class="bi bi-box-arrow-right"></i> Check Out</button>
            </div>
          </div>
        </div>

        <div class="tab-pane fade" id="leaveTab">
          <div class="card p-3 shadow-sm border-0 border-top border-warning border-4">
            <h6 class="fw-bold mb-3 text-secondary">Leave Application</h6>
            <select id="leaveType" class="form-select mb-3" onchange="checkLeaveType()"><option value="">Select Leave Type...</option></select>
            <div class="row g-2 mb-3">
              <div class="col-6"><label class="small fw-bold">Start Date</label><input type="date" id="lStart" class="form-control" onchange="calcDays()"></div>
              <div class="col-6"><label class="small fw-bold">End Date</label><input type="date" id="lEnd" class="form-control" onchange="calcDays()"></div>
            </div>
            <div class="mb-3"><label class="small fw-bold">Total Days</label><input type="number" id="lDays" class="form-control bg-light" readonly></div>
            <div class="mb-3"><label class="small fw-bold">Reason</label><textarea id="lReason" class="form-control" rows="2"></textarea></div>
            <div class="mb-3" id="photoUploadBox" style="display:none;">
              <label class="small fw-bold text-danger"><i class="bi bi-file-medical"></i> Medical Certificate (Required)</label>
              <input type="file" id="lPhoto" class="form-control" accept="image/*">
            </div>
            <button class="btn btn-warning w-100 fw-bold shadow-sm" id="btnLeave" onclick="submitLeave()">Submit Application</button>
          </div>
        </div>

        <div class="tab-pane fade" id="ledgerTab">
          <div class="card p-3 shadow-sm border-0 border-top border-info border-4">
            <h6 class="fw-bold mb-2 text-secondary">Individual Record History</h6>
            <div class="row g-2 mb-3 bg-light p-2 rounded">
              <div class="col-4">
                <select id="filterMonth" class="form-select form-select-sm" onchange="renderMyLedger()">
                  <option value="">Month</option>
                  <option value="1">Jan</option><option value="2">Feb</option><option value="3">Mar</option>
                  <option value="4">Apr</option><option value="5">May</option><option value="6">Jun</option>
                  <option value="7">Jul</option><option value="8">Aug</option><option value="9">Sep</option>
                  <option value="10">Oct</option><option value="11">Nov</option><option value="12">Dec</option>
                </select>
              </div>
              <div class="col-4">
                <select id="filterYear" class="form-select form-select-sm" onchange="renderMyLedger()">
                  <option value="">Year</option>
                  <option value="2025">2025</option><option value="2026">2026</option><option value="2027">2027</option>
                </select>
              </div>
              <div class="col-4">
                <select id="filterStatus" class="form-select form-select-sm" onchange="renderMyLedger()">
                  <option value="">All Types</option>
                  <option value="Attendance">Attendance</option>
                  <option value="Leave">Leave</option>
                  <option value="Merit">Merit</option>
                  <option value="Demerit">Demerit</option>
                </select>
              </div>
            </div>
            <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
              <table class="table table-sm table-bordered table-hover align-middle text-center">
                <thead class="table-dark sticky-top">
                  <tr><th>Date</th><th>Type</th><th>Details</th><th>Status / Pts</th></tr>
                </thead>
                <tbody id="myLedgerBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // ၁။ သင်၏ Firebase Config အချက်အလက်များကို ဤနေရာတွင် အစားထိုးပါ
    const firebaseConfig = {
  apiKey: "AIzaSyCnQcsv8TekFkOyOPnb3UWZytPq7zBxLfI",
  authDomain: "my-apps-a87a3.firebaseapp.com",
  projectId: "my-apps-a87a3",
  storageBucket: "my-apps-a87a3.firebasestorage.app",
  messagingSenderId: "880270085984",
  appId: "1:880270085984:web:d65a0c381172def3af1805"
};
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ၂။ သီးသန့်ဖိုင်မလိုဘဲ PWA Manifest ကို တိုက်ရိုက်ထုတ်ပေးခြင်း
    const manifestObj = {
      name: "Universal Tractor Employee Portal",
      short_name: "UT Portal",
      start_url: window.location.href,
      display: "standalone",
      background_color: "#f4f6f9",
      theme_color: "#601a1a",
      icons: [{
        src: "https://yjoszqcnfhqucdjfnryn.supabase.co/storage/v1/object/public/wms_photos/UT%20Logo_modified.png",
        sizes: "192x192",
        type: "image/png"
      }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/json' });
    document.getElementById('pwaManifest').setAttribute('href', URL.createObjectURL(manifestBlob));

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('btnInstallApp').style.display = 'inline-block';
    });

    async function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        document.getElementById('btnInstallApp').style.display = 'none';
      }
    }

    let currentEmp = null;
    let sysSettings = {};
    let leaveTypes = [];
    let cLat = 0, cLng = 0, isGeoOK = false, cTimeStatus = "";
    let globalLedgerData = [];

    window.onload = async () => {
      try {
        const sSnap = await db.collection('tms_settings').get();
        let systemKeys = ['Office Lat', 'Office Lng', 'Geo Radius', 'Work Start', 'Work End'];
        sSnap.docs.forEach(doc => {
          let row = doc.data();
          if (systemKeys.includes(row.category)) sysSettings[row.category] = row.subcategory;
          if (row.category === 'Leave Type') leaveTypes.push(row.subcategory);
        });
        document.getElementById('leaveType').innerHTML = '<option value="">Select Leave Type...</option>' + leaveTypes.map(t => `<option value="${t}">${t}</option>`).join('');

        // ယခင် Login ဝင်ထားသော Session ရှိမရှိ စစ်ဆေးခြင်း
        const savedCode = localStorage.getItem('ut_emp_code');
        if (savedCode) {
          const empDoc = await db.collection('employees').doc(savedCode).get();
          if (empDoc.exists && empDoc.data().status !== 'Inactive') {
            currentEmp = empDoc.data();
            showPortalUI();
          } else {
            localStorage.removeItem('ut_emp_code');
          }
        }
      } catch (err) {
        Swal.fire("Connection Error", err.message, "error");
      }
    };

    async function handleLogin(e) {
      e.preventDefault();
      let u = document.getElementById('loginUser').value.trim();
      let p = document.getElementById('loginPass').value.trim();
      let btn = document.getElementById('btnLogin');
      btn.disabled = true; btn.innerText = "Checking...";

      try {
        const snap = await db.collection('employees')
          .where('username', '==', u)
          .where('password', '==', p)
          .get();

        if (snap.empty) {
          Swal.fire("Login Failed", "Username သို့မဟုတ် Password မှားယွင်းနေပါသည်။", "error");
          return;
        }

        let empData = snap.docs[0].data();
        if (empData.status === 'Inactive') {
          Swal.fire("Access Denied", "သင်၏ အကောင့်မှာ Inactive ဖြစ်နေပါသည်။", "warning");
          return;
        }

        currentEmp = empData;
        localStorage.setItem('ut_emp_code', currentEmp.code);
        showPortalUI();
      } catch (err) {
        Swal.fire("Error", err.message, "error");
      } finally {
        btn.disabled = false; btn.innerText = "Login to Portal";
      }
    }

    function logoutEmp() {
      localStorage.removeItem('ut_emp_code');
      currentEmp = null;
      document.getElementById('loginSection').style.display = 'block';
      document.getElementById('profileBox').style.display = 'none';
      document.getElementById('formsSection').style.display = 'none';
      document.getElementById('btnLogout').style.display = 'none';
      document.getElementById('loginUser').value = '';
      document.getElementById('loginPass').value = '';
    }

    function showPortalUI() {
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('btnLogout').style.display = 'inline-block';
      document.getElementById('profName').innerText = currentEmp.name;
      document.getElementById('profPos').innerText = currentEmp.position || 'Position Not Set';
      document.getElementById('profDept').innerText = currentEmp.dept ? currentEmp.dept.replace('>', '-') : '';
      document.getElementById('profCodeBadge').innerText = "ID: " + currentEmp.code;

      let img = document.getElementById('profImg');
      if (currentEmp.photoUrl) { img.src = currentEmp.photoUrl; img.style.display = 'block'; }
      else { img.style.display = 'none'; }

      document.getElementById('profileBox').style.display = 'flex';
      document.getElementById('formsSection').style.display = 'block';
      checkEnv(currentEmp.code);
      fetchMyLedger(currentEmp.code);
    }

    async function checkEnv(empCode) {
      document.getElementById('btnIn').disabled = true;
      document.getElementById('btnOut').disabled = true;
      document.getElementById('geoStat').innerHTML = '<span class="spinner-border spinner-border-sm text-primary"></span> Locating...';
      document.getElementById('timeStat').innerHTML = '<span class="spinner-border spinner-border-sm text-primary"></span> Calculating...';

      try {
        let today = new Date().toLocaleString('en-GB').split(',')[0].trim();
        const attSnap = await db.collection('attendance')
          .where('emp_code', '==', empCode)
          .where('date_str', '==', today)
          .get();

        let status = { in: false, out: false };
        attSnap.docs.forEach(doc => {
          let a = doc.data();
          if (a.type === 'Check-In') status.in = true;
          if (a.type === 'Check-Out') status.out = true;
        });

        let d = new Date();
        let nowMins = d.getHours() * 60 + d.getMinutes();

        let wStartRaw = String(sysSettings['Work Start'] || "09:00");
        let wStartMatch = wStartRaw.match(/(\d+):(\d+)/);
        let wStartMins = wStartMatch ? parseInt(wStartMatch[1], 10) * 60 + parseInt(wStartMatch[2], 10) : 540;

        let wEndRaw = String(sysSettings['Work End'] || "17:00");
        let wEndMatch = wEndRaw.match(/(\d+):(\d+)/);
        let wEndMins = wEndMatch ? parseInt(wEndMatch[1], 10) * 60 + parseInt(wEndMatch[2], 10) : 1020;

        let timeString = d.toTimeString().slice(0, 5);
        let timeLabel = "Completed", timeClass = "text-muted fw-bold";

        if (!status.in) {
          if (nowMins <= wStartMins) { timeLabel = "On Time"; timeClass = "text-success fw-bold"; }
          else if (nowMins > wStartMins + 240) { timeLabel = "Half day"; timeClass = "text-danger fw-bold"; }
          else { timeLabel = "Late"; timeClass = "text-danger fw-bold"; }
        } else if (status.in && !status.out) {
          if (nowMins < wEndMins) { timeLabel = "Early check out"; timeClass = "text-warning fw-bold"; }
          else if (nowMins >= wEndMins + 60) { timeLabel = "Overtime"; timeClass = "text-primary fw-bold"; }
          else { timeLabel = "On Time"; timeClass = "text-success fw-bold"; }
        }

        cTimeStatus = timeLabel;
        document.getElementById('timeStat').innerText = `${timeLabel} (Current: ${timeString})`;
        document.getElementById('timeStat').className = timeClass;

        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(pos => {
            cLat = pos.coords.latitude; cLng = pos.coords.longitude;
            let oLat = parseFloat(sysSettings['Office Lat'] || 0);
            let oLng = parseFloat(sysSettings['Office Lng'] || 0);
            let rad = parseFloat(sysSettings['Geo Radius'] || 100);
            let dist = getDist(cLat, cLng, oLat, oLng);
            isGeoOK = (oLat === 0 && oLng === 0) ? true : dist <= rad;

            if (isGeoOK) {
              document.getElementById('geoStat').innerHTML = `<span class="text-success fw-bold"><i class="bi bi-check-circle-fill"></i> Inside Zone (${Math.round(dist)}m)</span>`;
              if (!status.in) document.getElementById('btnIn').disabled = false;
              if (status.in && !status.out) document.getElementById('btnOut').disabled = false;
            } else {
              document.getElementById('geoStat').innerHTML = `<span class="text-danger fw-bold"><i class="bi bi-x-circle-fill"></i> Outside Zone (${Math.round(dist)}m)</span>`;
            }
            if (status.in && status.out) document.getElementById('geoStat').innerHTML += " <br>(Completed Today)";
          }, () => {
            document.getElementById('geoStat').innerText = "GPS Access Denied.";
          }, { enableHighAccuracy: true });
        } else {
          document.getElementById('geoStat').innerText = "GPS not supported.";
        }
      } catch (err) {
        document.getElementById('timeStat').innerText = "Error fetching status";
      }
    }

    function getDist(lat1, lon1, lat2, lon2) {
      let p = 0.017453292519943295, c = Math.cos;
      return 12742000 * Math.asin(Math.sqrt(0.5 - c((lat2 - lat1) * p) / 2 + c(lat1 * p) * c(lat2 * p) * (1 - c((lon2 - lon1) * p)) / 2));
    }

    async function submitAtt(type) {
      if (!isGeoOK) return Swal.fire("Error", "You must be inside the office zone.", "error");
      document.getElementById('btnIn').disabled = true;
      document.getElementById('btnOut').disabled = true;

      let payload = {
        date_str: new Date().toLocaleString('en-GB').split(',')[0].trim(),
        time_str: new Date().toTimeString().slice(0, 8),
        emp_code: currentEmp.code,
        emp_name: currentEmp.name,
        type: type,
        location: `${cLat}, ${cLng}`,
        geo_status: "Inside Zone",
        time_status: cTimeStatus,
        created_at: Date.now()
      };

      try {
        await db.collection('attendance').add(payload);
        Swal.fire("Success", `${type} recorded successfully. [${cTimeStatus}]`, "success");
        checkEnv(currentEmp.code);
        fetchMyLedger(currentEmp.code);
      } catch (err) {
        Swal.fire("Error", err.message, "error");
        checkEnv(currentEmp.code);
      }
    }

    function checkLeaveType() {
      let type = document.getElementById('leaveType').value;
      document.getElementById('photoUploadBox').style.display = type.toLowerCase().includes('medical') ? 'block' : 'none';
    }

    function calcDays() {
      let d1 = new Date(document.getElementById('lStart').value);
      let d2 = new Date(document.getElementById('lEnd').value);
      document.getElementById('lDays').value = (d1 && d2 && d2 >= d1) ? Math.ceil(Math.abs(d2 - d1) / 86400000) + 1 : '';
    }

    function compressImage(file, maxWidth = 600) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const scale = maxWidth / img.width;
            canvas.width = img.width > maxWidth ? maxWidth : img.width;
            canvas.height = img.width > maxWidth ? img.height * scale : img.height;
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.7));
          };
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function submitLeave() {
      let type = document.getElementById('leaveType').value;
      let start = document.getElementById('lStart').value;
      let days = document.getElementById('lDays').value;
      let reason = document.getElementById('lReason').value;
      let fileIn = document.getElementById('lPhoto');
      let isMed = type.toLowerCase().includes('medical');

      if (!type || !start || !days) return Swal.fire("Incomplete", "Please fill required fields.", "warning");
      if (isMed && fileIn.files.length === 0) return Swal.fire("Required", "Please attach a Medical Certificate.", "warning");

      let btn = document.getElementById('btnLeave');
      btn.disabled = true; btn.innerText = "Submitting...";

      let payload = {
        apply_date: new Date().toLocaleString('en-GB').split(',')[0].trim(),
        emp_code: currentEmp.code,
        emp_name: currentEmp.name,
        leave_type: type,
        start_date: start,
        end_date: document.getElementById('lEnd').value,
        total_days: days,
        reason: reason,
        status: "Pending",
        created_at: Date.now()
      };

      try {
        if (isMed) payload.photoUrl = await compressImage(fileIn.files[0], 600);
        await db.collection('leave').add(payload);
        Swal.fire("Success", "Leave application submitted.", "success");
        ['lStart', 'lEnd', 'lDays', 'lReason', 'lPhoto'].forEach(id => document.getElementById(id).value = '');
        fetchMyLedger(currentEmp.code);
      } catch (err) {
        Swal.fire("Error", err.message, "error");
      } finally {
        btn.disabled = false; btn.innerText = "Submit Application";
      }
    }

    async function fetchMyLedger(empCode) {
      document.getElementById('myLedgerBody').innerHTML = '<tr><td colspan="4" class="text-muted py-3">Fetching Data...</td></tr>';
      try {
        const [attSnap, lvSnap, recSnap] = await Promise.all([
          db.collection('attendance').where('emp_code', '==', empCode).get(),
          db.collection('leave').where('emp_code', '==', empCode).get(),
          db.collection('records').where('emp_code', '==', empCode).get()
        ]);

        globalLedgerData = [];
        function parseDate(dateStr) {
          let parts = String(dateStr).split(',')[0].split('/');
          if (parts.length === 3) return new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
          return new Date(dateStr);
        }

        attSnap.docs.forEach(doc => {
          let a = doc.data();
          let dObj = parseDate(a.date_str);
          globalLedgerData.push({
            time: isNaN(dObj) ? Date.now() : dObj.getTime(),
            dateStr: a.date_str + " " + a.time_str,
            catType: "Attendance",
            typeHtml: '<span class="badge bg-info text-dark">Attendance</span>',
            details: a.type,
            status: a.time_status
          });
        });

        lvSnap.docs.forEach(doc => {
          let l = doc.data();
          let dObj = parseDate(l.apply_date);
          globalLedgerData.push({
            time: isNaN(dObj) ? 0 : dObj.getTime(),
            dateStr: l.apply_date,
            catType: "Leave",
            typeHtml: '<span class="badge bg-warning text-dark">Leave</span>',
            details: `${l.leave_type} (${l.total_days} Days)`,
            status: l.status
          });
        });

        recSnap.docs.forEach(doc => {
          let r = doc.data();
          let isMerit = r.type === 'MERIT';
          let dObj = parseDate(r.date_str);
          globalLedgerData.push({
            time: isNaN(dObj) ? 0 : dObj.getTime(),
            dateStr: r.date_str,
            catType: isMerit ? "Merit" : "Demerit",
            typeHtml: isMerit ? '<span class="badge bg-success">Merit</span>' : '<span class="badge bg-danger">Demerit</span>',
            details: r.line_remark || 'Official Record',
            status: (isMerit ? '+' : '-') + r.points + ' Pts'
          });
        });

        globalLedgerData.sort((a, b) => b.time - a.time);
        renderMyLedger();
      } catch (err) {
        document.getElementById('myLedgerBody').innerHTML = `<tr><td colspan="4" class="text-danger py-3">Error: ${err.message}</td></tr>`;
      }
    }

    function renderMyLedger() {
      let fMonth = document.getElementById('filterMonth').value;
      let fYear = document.getElementById('filterYear').value;
      let fStatus = document.getElementById('filterStatus').value;

      let filtered = globalLedgerData.filter(d => {
        let dObj = new Date(d.time);
        let matchM = fMonth === "" || (dObj.getMonth() + 1).toString() === fMonth;
        let matchY = fYear === "" || dObj.getFullYear().toString() === fYear;
        let matchS = fStatus === "" || d.catType === fStatus;
        return matchM && matchY && matchS;
      });

      if (filtered.length === 0) {
        document.getElementById('myLedgerBody').innerHTML = '<tr><td colspan="4" class="text-muted py-3">No records found.</td></tr>';
        return;
      }

      document.getElementById('myLedgerBody').innerHTML = filtered.map(d => {
        let statClass = (d.status.includes('Late') || d.status.includes('Half') || d.status.includes('-') || d.status === 'Rejected') ? 'text-danger fw-bold' : 'text-success fw-bold';
        if (d.status.includes('Pending')) statClass = 'text-warning fw-bold';
        return `<tr><td class="small text-nowrap">${d.dateStr}</td><td>${d.typeHtml}</td><td class="small text-start">${d.details}</td><td class="${statClass} small text-nowrap">${d.status}</td></tr>`;
      }).join('');
    }
  </script>
</body>
</html>
